name: Build FormPic Release Artifacts (AAB & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production release keystore from repository secret"
            echo "$KEYSTORE_BASE64" | base64 --decode > formpic-release.jks
            cat <<EOF > keystore.properties
          storeFile=formpic-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=formpic-key
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          else
            echo "Generating release keystore for CI release packaging"
            keytool -genkeypair -v -keystore formpic-release.jks -alias formpic-key -keyalg RSA -keysize 2048 -validity 10000 -storepass ayushgupta -keypass ayushgupta -dname "CN=Ayush Gupta, OU=Development, O=FormPic, L=Chandigarh, ST=Chandigarh, C=IN"
            cat <<EOF > keystore.properties
          storeFile=formpic-release.jks
          storePassword=ayushgupta
          keyAlias=formpic-key
          keyPassword=ayushgupta
          EOF
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Core Tests
        run: ./gradlew :core:test --stacktrace

      - name: Build Release Bundle (.aab) & APK (.apk)
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report Build Log on Failure
        if: failure()
        run: |
          echo "## ❌ Gradle Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: formpic-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: formpic-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "FormPic v1.0.5 — Official Production Release"
          body: |
            ## FormPic v1.0.5 — Direct Android APK & AAB Release
            
            FormPic is a privacy-first, on-device photo resizer, signature processor, and background isolation tool designed for Indian passport, exam (SSC, UPSC, IBPS, NEET, RRB), and government portal applications.
            
            ### 📥 Download & Install on Android:
            - **Direct APK (Tap to install on any Android phone)**: [app-release.apk](https://github.com/Ayush4Gupta/FormPic/releases/download/v1.0.5/app-release.apk)
            - **Google Play / Store Bundle**: [app-release.aab](https://github.com/Ayush4Gupta/FormPic/releases/download/v1.0.5/app-release.aab)
            
            ### What's New in v1.0.5:
            - 💬 **In-App Feedback & Exam Preset Request System**: Added a native dialog accessible from Settings and Help & FAQ. Candidates can request new exam presets (State PSCs, Police, Universities), report portal issues, or suggest features with 1-tap email submission and clipboard copy fallback.
            - ✒️ **Fixed Signature Processing (No False Eye Checks)**: Dedicated signature pipeline that completely bypasses ML Kit face detection and eye-openness checks. Signature handwriting is never mistaken for eyes, with verified green approval badge.
            - 📐 **Passport Size (3.5 × 4.5 cm) Framing Toggle**: Quick KB targets (25, 50, 75, 100 KB) and Custom sizes can toggle between Passport Size framing and Original Photo Aspect Ratio. Official exam presets enforce portal-mandated framing by default.
            - ⚡ **Dual 1-Tap Live Swappers (< 200 ms)**: Instantly swap between Passport Size ⇄ Original Framing and Pure White ⇄ Original Background directly on the Result Preview screen without re-uploading!
            - 🎛️ **Dual-Command Center on Home Screen**: Intuitive switchers for Framing Mode and Background Mode with clear Portal-Mandated status indicators.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
