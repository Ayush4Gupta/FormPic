name: Build FormPic Release AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > formpic-release.jks
          cat <<EOF > keystore.properties
          storeFile=formpic-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=formpic-key
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Core Tests
        run: ./gradlew :core:test --stacktrace

      - name: Build Release Android App Bundle (.aab)
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: formpic-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
