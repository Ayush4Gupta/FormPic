name: Build ValidPic Release Artifacts (AAB & APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using production release keystore from repository secret"
            echo "$KEYSTORE_BASE64" | base64 --decode > validpic-release.jks
            cat <<EOF > keystore.properties
          storeFile=validpic-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=validpic-key
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          else
            echo "Generating release keystore for CI release packaging"
            keytool -genkeypair -v -keystore validpic-release.jks -alias validpic-key -keyalg RSA -keysize 2048 -validity 10000 -storepass ayushgupta -keypass ayushgupta -dname "CN=Ayush Gupta, OU=Development, O=ValidPic, L=Chandigarh, ST=Chandigarh, C=IN"
            cat <<EOF > keystore.properties
          storeFile=validpic-release.jks
          storePassword=ayushgupta
          keyAlias=validpic-key
          keyPassword=ayushgupta
          EOF
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Core Tests
        run: ./gradlew :core:test --stacktrace

      - name: Build Release Bundle (.aab) & APK (.apk)
        run: |
          set -e
          set -o pipefail
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Report Build Log
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## 📋 Gradle Release Build Log (Tail)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 250 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish CI Build Log on Failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-debug-log
            git rm -rf . || true
            cp build.log error.log
            git add error.log
            git commit -m "Capture CI build failure log" || true
            git push -f origin ci-debug-log || true
          fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validpic-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validpic-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "ValidPic v1.0.8 — Official Production Release"
          body: |
            ## ValidPic v1.0.8 — Direct Android APK & AAB Release
            
            ValidPic is a privacy-first, on-device photo resizer, signature processor, and background isolation tool designed for Indian passport, exam (SSC, UPSC, IBPS, NEET, RRB), and government portal applications.
            
            ### 📥 Download & Install on Android:
            - **Direct APK (Tap to install on any Android phone)**: [app-release.apk](https://github.com/Ayush4Gupta/FormPic/releases/download/v1.0.8/app-release.apk)
            - **Google Play / Store Bundle**: [app-release.aab](https://github.com/Ayush4Gupta/FormPic/releases/download/v1.0.8/app-release.aab)
            
            ### What's New in v1.0.8:
            - 🏛️ **Official Rebrand to ValidPic**: Upgraded brand identity, verified portal compliance, and updated package namespace.
            - 🚀 **Live Google Form & Sheet Feedback Hub**: Silent in-app feedback submissions and exam preset requests now automatically route directly to the official Google Form / Google Sheet in real time.
            - 📁 **Configurable Photo Save Location**: Interactive Settings dialog to switch where processed photos are saved (`Pictures/ValidPic`, `Download/ValidPic`, or `DCIM/ValidPic`) with 1-tap "Open in Gallery" launcher.
            - ✒️ **Dedicated Signature Pipeline**: Face detection and eye checks completely bypassed for signatures with verified green approval badge.
            - 📐 **Passport Size (3.5 × 4.5 cm) Live Framing**: 1-tap toggle between Passport Size and Original Framing directly on the Result screen.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
